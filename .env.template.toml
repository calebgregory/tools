# cp .env.template.toml .env.toml
#
# then fill this out
computer_name = ''

[claude.project-targets]
vault-main = "~/_/main"
work-org = ""

# Optional: override the path used to derive the auto-memory key for a project.
# Defaults to the project target above. Set this when Claude Code's auto-memory
# key was derived from an ancestor of the target (e.g. target=~/work/notes/personal-work
# but auto-memory lives at ~/.claude/projects/-Users-<you>-work-notes/memory).
[claude.auto-memory-paths]
# work-org = "~/work/notes"

# Directories that tmux window titles name with an alias instead of the first few
# characters of the directory name. The alias replaces the name wherever it shows,
# so `~/work/ds-monorepo-wt/main` reads `mt/main`.
[tmux.dir-aliases]
# "~/work/ds-monorepo-wt" = "mt"

# An OAuth client of type "Desktop app", from a Google Cloud project with the Gmail API
# enabled. Used by gmail-sender-report / gmail-trash-sender; the token they obtain from it
# is cached in .secret/gmail_token.json.
[gmail]
client_id = ""
client_secret = ""

[vault]
walked-file = "~/_/main/walked.md"
