# prefix+n: new session by name. h/l cover next/previous window (windows.conf), which frees n.
# -d plus switch-client because a bare new-session from inside tmux refuses to nest.
unbind-key n
bind-key n command-prompt -p "new session:" { new-session -d -s "%%" ; switch-client -t "%%" }

# prefix+j / prefix+k: previous / next session in the order the session row shows.
# tmux-session-labels writes each session's neighbours to @prev_session and
# @next_session (see below); run-shell because -t does not expand formats. The ids
# are `$N`, so they go to sh in single quotes or it reads them as positionals.
bind-key j run-shell "tmux switch-client -t '#{@prev_session}'"
bind-key k run-shell "tmux switch-client -t '#{@next_session}'"

# prefix+S: move this session to a position in the session row; the others shift.
bind-key S command-prompt -p "move session to:" { run-shell "tmux-session-labels move '#{session_id}' '%%'" }

# prefix+s: pick a session from a menu in the session row's order, keyed by its
# number. choose-tree can only list sessions in creation order (see
# tmux-session-labels); prefix+w still gives the full tree.
bind s run-shell "tmux-session-labels menu '#{client_name}' '#{@appearance}'"

# Session numbers and colors. tmux-session-labels (~/tools/main) numbers sessions
# in @index (new ones go last, prefix+S moves one, closing one closes the gap) and
# deals each the window-title palette entry at its number, in both appearances;
# @session_color picks one. It also renders the whole session row into the global
# @session_row, since a #{S:...} loop can only walk sessions in creation order.
set -g @session_color '#{?#{==:#{@appearance},light},#{@session_color_light},#{@session_color_dark}}'
run -b 'tmux-session-labels'
set-hook -g session-created 'run -b "tmux-session-labels"'
set-hook -g session-renamed 'run -b "tmux-session-labels"'
set-hook -g session-closed 'run -b "tmux-session-labels"'

# current session name as a badge in its color
set -g status-left '#[fg=#{E:@session_color},reverse,bold] #{session_name} #[default] '
set -g status-left-length 30

# Second status row: every session as `<index>: <name>` with the name in its color,
# this client's session bold and underlined in its color (us= needs the outer
# terminal's usstyle feature). Each name sits in a range=session marker, so a
# mouse click switches to it. tmux-session-labels renders it (see above); E:
# expands the stored format. tmux 3.7 ships a built-in session list as
# status-format[2]; this is that list in @index order, without the "S:" label
# and the status-left alignment padding.
set -g status 2
set -g 'status-format[1]' '#{E:@session_row}'
