#
# easyjump
#
# J rather than its default j, which prefix+j (previous session) takes in sessions.conf.
set-option -g @easyjump-key-binding "J"
set-option -g @plugin "roy2220/easyjump.tmux"

#
# tmux-resurrect: prefix+C-s saves sessions, windows, panes and their directories;
# prefix+C-r restores them. tmux-continuum saves every 15 minutes and restores the
# last save when the tmux server starts, so sessions come back after a reboot.
#
set-option -g @plugin "tmux-plugins/tmux-resurrect"
set-option -g @plugin "tmux-plugins/tmux-continuum"
set-option -g @resurrect-capture-pane-contents "on"
set-option -g @continuum-restore "on"

#
# tpack: installs and sources the @plugin declarations above.
# Binary comes from `go install github.com/tmuxpack/tpack/cmd/tpack@latest`.
# Keep this at the very bottom: it only sees @plugin lines declared before it, so
# .tmux.conf sources this file last. tmux-continuum also appends its autosave to
# status-right (appearance.conf) when it loads, so nothing may set status-right after.
#
run 'tpack init'
