# tmux reads these in order, as if they were one file. A later setting of the same
# option, key or hook replaces an earlier one. Each file holds one feature.

source-file ~/tools/dotfiles/tmux/core.conf  # terminal, shell, prefix, vi keys
source-file ~/tools/dotfiles/tmux/copy-mode.conf  # copy and paste
source-file ~/tools/dotfiles/tmux/windows.conf
source-file ~/tools/dotfiles/tmux/sessions.conf
source-file ~/tools/dotfiles/tmux/appearance.conf
source-file ~/tools/dotfiles/tmux/lemonaid.conf
source-file ~/tools/dotfiles/tmux/plugins.conf  # must be last
