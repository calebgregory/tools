# Window titles: `parent/child` with each segment colored deterministically, or the app
# running in the pane (claude, emacs, ...). pane_path comes from OSC 7, which oh-my-zsh
# already emits on every prompt (lib/termsupport.zsh), so no shell snippet is needed.
# A window renamed by hand (prefix+,) shows its name instead. rename-window turns off
# automatic-rename for that window, so the last argument is empty until you rename it.
# Source: ~/tools/main/src/tools/tmux/window_status.py
setw -g window-status-format " #I:#(tmux-window-status '#{pane_path}' '#{pane_current_path}' '#{pane_current_command}' '#{pane_title}' '#{@appearance}' '#{?automatic-rename,,#W}') "
setw -g window-status-current-format " #I:#(tmux-window-status '#{pane_path}' '#{pane_current_path}' '#{pane_current_command}' '#{pane_title}' '#{@appearance}' '#{?automatic-rename,,#W}') "

#
# select window view configuration - highlight session row
#
bind w choose-tree -Zw -F '#{?pane_format,#{?pane_marked,#[reverse],}#{?pane_floating_flag,#[italics],}#{pane_current_command}#{pane_flags}#{?#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}},: "#{pane_title}",},#{?window_format,#[fg=cyan]#{?window_marked_flag,#[reverse],}#{window_name}#{window_flags}#{?#{&&:#{==:#{window_panes},1},#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}}},: "#{pane_title}",}#[default],#[fg=yellow#,bold]#{session_windows} windows#{?session_grouped, (group #{session_group}: #{session_group_list}),}#{?session_attached, (attached),}#[default]}}'
# The selected row flips whatever colors the format gave it, so the yellow session
# row stays readable under the cursor (the default is bg=yellow,fg=black).
set -g mode-style reverse

#
# lemonaid: see ~/tools/lemonaid/docs/tmux.md
#

# prefix+b: ping-pong between where you are and where you came from (the inbox saves
# your location every time it switches you somewhere)
bind-key b run-shell ' \
    target=$(lemonaid tmux swap "#{session_name}" "#{pane_id}"); \
    if [ -n "$target" ]; then \
        tmux switch-client -t "$(echo "$target" | cut -d"|" -f2)"; \
    fi'

# prefix+B: show the current lemon's brief (in the inbox pane when it follows on the
# left, else a popup); press again to close. Lowercase b is the ping-pong above.
bind-key B run-shell -b 'lemonaid brief show "#{session_name}:#{window_index}" --popup'

# prefix+a ("aid"): show / focus / hide the inbox pane (in follow mode: toggle focus only)
bind-key a run-shell 'lemonaid tmux scratch'
# prefix+A: move the inbox pane between the left edge (cards) and the top (columns)
bind-key A run-shell 'lemonaid tmux scratch --flip'

#
# easyjump
#
# J rather than its default j, which prefix+j (previous session) takes above.
set-option -g @easyjump-key-binding "J"
set-option -g @plugin "roy2220/easyjump.tmux"

#
# tpack: installs and sources the @plugin declarations above.
# Binary comes from `go install github.com/tmuxpack/tpack/cmd/tpack@latest`.
# Keep this at the very bottom -- it only sees @plugin lines declared before it.
#
run 'tpack init'
