set -g default-terminal "tmux-256color"
# true color + OSC 7 (cwd) forwarding to the outer terminal, for tmux-window-status's colored window titles
set -as terminal-features ',xterm*:RGB'
set -as terminal-features ',xterm*:osc7'
set -g default-shell $SHELL
if -b 'command -v reattach-to-user-namespace > /dev/null 2>&1' 'set -g default-command "reattach-to-user-namespace -l ${SHELL}"'

# with follow mode, exiting the last shell in a session switches to another session
# instead of detaching the client
set -g detach-on-destroy off

# nvim follows the macOS light/dark setting, and re-checks it when it gets the
# focus back; without this it never hears about the focus.  See
# nvim/lua/config/appearance.lua.
set -g focus-events on

setw -g mode-keys vi

# vim-style window movement
bind-key h previous-window
bind-key l next-window

# prefix+p belongs to lemonaid (below); paste is prefix+P (and the default prefix+])
unbind p
bind P paste-buffer
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'V' send -X select-line
bind-key -T copy-mode-vi 'r' send -X rectangle-toggle
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "pbcopy"

set-option -g prefix C-x
unbind-key C-b
bind-key C-x send-prefix

#### COLOUR

# The status bar follows the macOS light/dark setting, so its three background
# colors are set by tmux/appearance.sh rather than here -- that script is the
# one place they are written down. It also exports @appearance for the window
# title script. No fg for the window titles: tmux-window-status (~/tools/main)
# colors each one by directory / process.
run -b '~/tools/dotfiles/tmux/appearance.sh'
set-hook -g client-attached 'run -b "~/tools/dotfiles/tmux/appearance.sh"'
set-hook -g client-focus-in 'run -b "~/tools/dotfiles/tmux/appearance.sh"'

set-window-option -g window-status-separator "│"

# session name, inverted, colored by name
set -g status-left '#(lemonaid-tmux-session-name "#{session_name}") '
set -g status-left-length 30
# Show Git working tree status.
#
# appearance.sh is spliced in here for its side effect, not its output -- it
# prints nothing. The two hooks above only fire when the terminal loses and
# regains focus, so they miss the case that matters most: toggling the macOS
# appearance from the menu bar with this window still in front. tmux has no
# timer hook, so the status redraw (status-interval, 15s) is the only clock
# available. The script exits after one `defaults` read when nothing changed.
set -g status-right '#(~/tools/dotfiles/tmux/appearance.sh)#(gitmux -cfg "$HOME/.gitmux.conf" "#{pane_current_path}")'

