set -g default-terminal "tmux-256color"
# true color + OSC 7 (cwd) forwarding to the outer terminal, for tmux-window-status's colored window titles
set -as terminal-features ',xterm*:RGB'
set -as terminal-features ',xterm*:osc7'
set -g default-shell $SHELL
if -b 'command -v reattach-to-user-namespace > /dev/null 2>&1' 'set -g default-command "reattach-to-user-namespace -l ${SHELL}"'

# with follow mode, exiting the last shell in a session switches to another session
# instead of detaching the client
set -g detach-on-destroy off

# nvim follows the macOS light/dark setting, and re-checks it when it gets the
# focus back; without this it never hears about the focus.  See
# nvim/lua/config/appearance.lua.
set -g focus-events on

setw -g mode-keys vi

# vim-style window movement
bind-key h previous-window
bind-key l next-window

# prefix+n: new session by name. h/l cover next/previous window, which frees n.
# -d plus switch-client because a bare new-session from inside tmux refuses to nest.
unbind-key n
bind-key n command-prompt -p "new session:" { new-session -d -s "%%" ; switch-client -t "%%" }

# prefix+j / prefix+k: previous / next session in the creation order the session
# row shows. prefix+<digit>: the session with that number in the row. The digits
# replace the default select-window bindings; h/l cover windows.
bind-key j switch-client -p -O creation
bind-key k switch-client -n -O creation
bind-key 0 run-shell -b '~/tools/dotfiles/tmux/switch-session.sh 0'
bind-key 1 run-shell -b '~/tools/dotfiles/tmux/switch-session.sh 1'
bind-key 2 run-shell -b '~/tools/dotfiles/tmux/switch-session.sh 2'
bind-key 3 run-shell -b '~/tools/dotfiles/tmux/switch-session.sh 3'
bind-key 4 run-shell -b '~/tools/dotfiles/tmux/switch-session.sh 4'
bind-key 5 run-shell -b '~/tools/dotfiles/tmux/switch-session.sh 5'
bind-key 6 run-shell -b '~/tools/dotfiles/tmux/switch-session.sh 6'
bind-key 7 run-shell -b '~/tools/dotfiles/tmux/switch-session.sh 7'
bind-key 8 run-shell -b '~/tools/dotfiles/tmux/switch-session.sh 8'
bind-key 9 run-shell -b '~/tools/dotfiles/tmux/switch-session.sh 9'

unbind p
bind p paste-buffer
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'V' send -X select-line
bind-key -T copy-mode-vi 'r' send -X rectangle-toggle
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "pbcopy"

set-option -g prefix C-x
unbind-key C-b
bind-key C-x send-prefix

#### COLOUR

# The status bar follows the macOS light/dark setting, so its three background
# colors are set by tmux/appearance.sh rather than here -- that script is the
# one place they are written down. It also exports @appearance for the window
# title script. No fg for the window titles: tmux-window-status (~/tools/main)
# colors each one by directory / process.
run -b '~/tools/dotfiles/tmux/appearance.sh'
set-hook -g client-attached 'run -b "~/tools/dotfiles/tmux/appearance.sh"'
set-hook -g client-focus-in 'run -b "~/tools/dotfiles/tmux/appearance.sh"'

set-window-option -g window-status-separator "│"

# Session numbers and colors. tmux-session-labels (~/tools/main) writes each
# session's position in creation order to @index and deals it the window-title
# palette entry at that position, in both appearances; @session_color picks one.
# Stored rather than computed in place because the format language has no loop
# counter and a #() inside a #{S:...} loop runs once, not once per session.
# Creation order is what the #{S:...} loop in the session row renders, so the
# number on screen is the number prefix+<digit> selects.
set -g @session_color '#{?#{==:#{@appearance},light},#{@session_color_light},#{@session_color_dark}}'
run -b 'tmux-session-labels'
set-hook -g session-created 'run -b "tmux-session-labels"'
set-hook -g session-renamed 'run -b "tmux-session-labels"'
set-hook -g session-closed 'run -b "tmux-session-labels"'

# current session name as a badge in its color
set -g status-left '#[fg=#{E:@session_color},reverse,bold] #{session_name} #[default] '
set -g status-left-length 30
# Show Git working tree status.
#
# appearance.sh is spliced in here for its side effect, not its output -- it
# prints nothing. The two hooks above only fire when the terminal loses and
# regains focus, so they miss the case that matters most: toggling the macOS
# appearance from the menu bar with this window still in front. tmux has no
# timer hook, so the status redraw (status-interval, 15s) is the only clock
# available. The script exits after one `defaults` read when nothing changed.
set -g status-right '#(~/tools/dotfiles/tmux/appearance.sh)#(gitmux -cfg "$HOME/.gitmux.conf" "#{pane_current_path}")#(~/tools/dotfiles/tmux/diff-progress.sh "#{pane_current_path}")'
set -g status-right-length 60

# Second status row: every session as `<index>: <name>` in its color, this client's
# session bold and underlined. Each name sits in a range=session marker, so a
# mouse click switches to it. tmux 3.7 ships a built-in session list as
# status-format[2]; this is a trimmed version without the "S:" label and the
# status-left alignment padding.
set -g status 2
set -g 'status-format[1]' '#[align=left]#{S:#[range=session|#{session_id} fg=#{E:@session_color}]#{?#{==:#{session_name},#{client_session}},#[bold#,underscore],} #{@index}: #{session_name} #[norange default] }'

