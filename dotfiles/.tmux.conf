# Window titles: `parent/child` with each segment colored deterministically, or the app
# running in the pane (claude, emacs, ...). pane_path comes from OSC 7, which oh-my-zsh
# already emits on every prompt (lib/termsupport.zsh), so no shell snippet is needed.
# Source: ~/tools/main/src/tools/tmux/window_status.py
setw -g window-status-format " #I:#(tmux-window-status '#{pane_path}' '#{pane_current_path}' '#{pane_current_command}' '#{pane_title}' '#{@appearance}') "
setw -g window-status-current-format " #I:#(tmux-window-status '#{pane_path}' '#{pane_current_path}' '#{pane_current_command}' '#{pane_title}' '#{@appearance}') "

#
# lemonaid: see ~/tools/lemonaid/docs/tmux.md
#

# prefix+p: ping-pong between where you are and where you came from (the inbox saves
# your location every time it switches you somewhere)
bind-key p run-shell ' \
    target=$(lemonaid tmux swap "#{session_name}" "#{pane_id}"); \
    if [ -n "$target" ]; then \
        tmux switch-client -t "$(echo "$target" | cut -d"|" -f2)"; \
    fi'

# prefix+a ("aid"): show / focus / hide the inbox pane (in follow mode: toggle focus only)
bind-key a run-shell 'lemonaid tmux scratch'
# prefix+A: move the inbox pane between the left edge (cards) and the top (columns)
bind-key A run-shell 'lemonaid tmux scratch --flip'

#
# easyjump
#
set-option -g @plugin "roy2220/easyjump.tmux"

#
# tpack: installs and sources the @plugin declarations above.
# Binary comes from `go install github.com/tmuxpack/tpack/cmd/tpack@latest`.
# Keep this at the very bottom -- it only sees @plugin lines declared before it.
#
run 'tpack init'
