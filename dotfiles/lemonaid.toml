# Lemonaid configuration. Reference: ~/tools/lemonaid/docs/config.md
# Symlinked to ~/.config/lemonaid/config.toml by bootstrap/symlink-dotfiles.sh

[wezterm]
# How to resolve pane from notification metadata
# Options: "tty" (match TTY to pane), "metadata" (use workspace/pane_id from metadata)
resolve_pane = "tty"

[tmux-session]
# The inbox pane follows you across windows and sessions on every new tmux server.
# Turn it off for one server with `lemonaid tmux scratch --unfollow`.
follow_scratch = true
# Left edge renders sessions as cards; `prefix+L` (or `f` in lma) flips it to a top strip.
scratch_position = "left"
scratch_width = "45"
scratch_height = "10"
# `lemonaid tmux new` / `lemonaid place open` build sessions from this window list.
# Window 0 is the one `T` in history replaces with the resume command (resume_window).
resume_window = 0
# Directories a Codex lemon may write outside its workspace. Reviewers write their review doc into
# the notes repo, which the workspace-write sandbox would otherwise refuse.
codex_writable_roots = ["~/work/notes"]

[tmux-session.templates]
default = ["claude", ""]
shell = [""]

# Lemon presets: `lemonaid lemon start ... --preset codex`, `lemonaid place open ... --preset codex`.
# `--no-daemon` is required for any Codex launch that attaches a brief (a Codex on the shared
# app-server can't be matched to its window). `--approve-for-me` routes approval requests through
# Codex's automatic review in the workspace-write sandbox instead of asking in the pane.
[launch.presets.codex]
harness = "codex"
args = ["--no-daemon", "--approve-for-me"]
description = "Codex; approvals routed to automatic review in the workspace-write sandbox"

[tui]
# Color cards by brief status and show what each lemon needs from me.
brief_status = true

# Context use per lemon, as a percentage of this threshold (100% = time to wrap up).
[tui.context_threshold]
claude = "50%"
codex = "50%"

[tui.keybindings]
up_down = "kj"

[brief]
# Obsidian vaults: `.md` paths under these open in Obsidian (briefs, and terminal
# clicks via `lemonaid terminal vault-links wezterm`; re-run that after changing this).
vaults = ["~/work/notes"]

# Places: directories and their tmux sessions. lemonaid delegates worktree
# operations to `wt` (thds.gent). Reference: ~/tools/lemonaid/docs/places.md
[places]
protected_sessions = ["main", "tools"]

[[places.roots]]
path = "~/work/ds-monorepo-wt"
list = "git -C .bare worktree list --porcelain | grep '^worktree ' | sed 's/^worktree //' | grep -v '/\\.bare$'"
path_of = "wt path {key}"
create = "wt co {key}"
destroy = "wt rm -f {key}"
inspect = "wt status {dir}"

[[places.roots]]
path = "~/work/ds-monorepo"

[[places.roots]]
path = "~/work/notes"

[[places.roots]]
path = "~/tools"
